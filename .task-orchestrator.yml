# task-orchestrator 프로젝트 오버라이드
# 글로벌 ~/.claude/skills/task-orchestrator/config.yml 위에 deep-merge 됨

# 운영 모드: Notion 없이 로컬 markdown 산출물 (사용자 선택, 2026-05-31)
mode: teammate
teammate:
  artifact_dir: docs/tasks/

# Phase -0.5 구조 분석 캐시 (사용자 컨펌, 2026-05-31)
project_structure:
  primary_pattern: feature-based
  secondary_patterns:
    - nextjs-app-router
  analyzed_at: "2026-05-31"
  folder_hash: "initial-scaffold"
  user_confirmed: true
  proposed: true   # 신규 repo — 추정이 아니라 제안 후 확정
  folders:
    - { path: "src/app/", role: "라우팅 + 페이지(RSC) + Route Handler(api)", confidence: high }
    - { path: "src/features/attendance/", role: "출퇴근 도메인 UI+훅+타입", confidence: high }
    - { path: "src/features/pay/", role: "급여 도메인 UI+훅+타입", confidence: high }
    - { path: "src/components/", role: "공용 재사용 UI (BottomNav, Card, BottomSheet 등)", confidence: high }
    - { path: "src/lib/", role: "인메모리 store + 시간/급여 계산 util + 상수", confidence: high }
    - { path: "src/types/", role: "공용 타입 정의", confidence: high }
  ai_suggested_placements:
    new_feature_code: "src/features/<name>/"
    new_shared_ui: "src/components/"
    new_util_or_store: "src/lib/"
    new_api_route: "src/app/api/<name>/route.ts"
    new_shared_type: "src/types/"
  user_notes: >
    Crewmon(크루몬) 출퇴근/급여 앱 클론. 메인 코랄/오렌지 테마, 모바일 세로 전용,
    바텀 탭 4개(홈/출퇴근/급여/마이페이지) 중 이번 범위는 홈·출퇴근·급여.
    백엔드는 Next Route Handler + 인메모리 저장.
